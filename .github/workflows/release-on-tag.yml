name: Release on Tag

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Flutter pub get
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Zip full Windows Release directory (portable)
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          $dst = "fuel_service_log_windows_${{ github.ref_name }}.zip"
          if (Test-Path $dst) { Remove-Item $dst -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $dst
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            fuel_service_log_windows_${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Flutter pub get
        run: flutter pub get
      - name: Build APK (release)
        run: flutter build apk --release
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional: AAB (requires signing config in project)
      # - name: Build AAB (release)
      #   run: flutter build appbundle --release
      # - name: Upload AAB to Release
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     files: |
      #       build/app/outputs/bundle/release/app-release.aab
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
