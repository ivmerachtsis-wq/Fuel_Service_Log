name: Release on Tag

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Flutter pub get
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Zip exe
        shell: pwsh
        run: |
          $exe = "build/windows/x64/runner/Release/fuel_service_log.exe"
          Compress-Archive -Path $exe -DestinationPath "fuel_service_log_windows_${{ github.ref_name }}.zip"
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fuel_service_log_windows_${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Flutter pub get
        run: flutter pub get
      - name: Build APK (release)
        run: flutter build apk --release
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional: AAB (requires signing config in project)
      # - name: Build AAB (release)
      #   run: flutter build appbundle --release
      # - name: Upload AAB to Release
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     files: |
      #       build/app/outputs/bundle/release/app-release.aab
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
